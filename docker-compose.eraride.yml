version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: eraride-postgres
    environment:
      POSTGRES_DB: eraride
      POSTGRES_USER: eraride
      POSTGRES_PASSWORD: eraride
    ports:
      - '5432:5432'
    volumes:
      - eraride_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eraride-redis
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend_fastapi
    container_name: eraride-backend
    env_file:
      - ./backend_fastapi/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://eraride:eraride@postgres:5432/eraride
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-for-local-only
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'
    volumes:
      - ./backend_fastapi:/app

volumes:
  eraride_pg_data:
